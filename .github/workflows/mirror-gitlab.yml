# Mirror GitHub -> gitlab.embeddednotes.tech/k.fernandes/iq_forge.
# The reverse direction is a GitLab push mirror with "Keep divergent refs".
# Pushes are fast-forward only: if the two sides diverge, this job fails
# instead of overwriting commits; merge both sides locally and push again.
name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.embeddednotes.tech/k.fernandes/iq_forge.git"
          git push gitlab "${GITHUB_SHA}:${GITHUB_REF}"
